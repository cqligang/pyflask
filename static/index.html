<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Go 客户端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; }
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-box {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            border: 2px solid #0f3460;
        }
        .video-box h3 {
            margin-bottom: 10px;
            color: #e94560;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        video {
            width: 100%;
            background: #000;
            border-radius: 8px;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-connect { background: #00d4ff; color: #1a1a2e; }
        .btn-connect:hover { background: #00b8e6; transform: translateY(-2px); }
        .btn-hangup { background: #e94560; color: #fff; }
        .btn-hangup:hover { background: #d63850; transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status {
            text-align: center;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .status-item { text-align: center; }
        .status-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .status-value {
            font-size: 18px;
            font-weight: 600;
            color: #00d4ff;
        }
        .status-value.connected { color: #4ade80; }
        .status-value.disconnected { color: #e94560; }
        .chat-section {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .chat-section h3 {
            margin-bottom: 10px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .chat-messages {
            height: 150px;
            overflow-y: auto;
            background: #0f3460;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .chat-msg {
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .chat-msg.local {
            background: #00d4ff;
            color: #1a1a2e;
            margin-left: auto;
        }
        .chat-msg.remote {
            background: #e94560;
            color: #fff;
            margin-right: auto;
        }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
        }
        .chat-input input:focus { outline: 2px solid #00d4ff; }
        .chat-input button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .log-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-container h3 {
            margin-bottom: 10px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log-item {
            font-family: monospace;
            font-size: 12px;
            padding: 4px 0;
            color: #aaa;
            border-bottom: 1px solid #0f3460;
        }
        .log-item.info { color: #00d4ff; }
        .log-item.error { color: #e94560; }
        .log-item.success { color: #4ade80; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Go 客户端通话</h1>
        
        <div class="status">
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">连接状态</div>
                    <div class="status-value disconnected" id="peerStatus">未连接</div>
                </div>
                <div class="status-item">
                    <div class="status-label">数据通道</div>
                    <div class="status-value disconnected" id="dcStatus">未打开</div>
                </div>
            </div>
        </div>

        <div class="video-container">
            <div class="video-box">
                <h3>本地视频 (浏览器)</h3>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div class="video-box">
                <h3>远端视频 (Go端)</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <div class="controls">
            <button class="btn-connect" id="connectBtn" onclick="startCall()">开始通话</button>
            <button class="btn-hangup" id="hangupBtn" onclick="hangUp()" disabled>挂断</button>
        </div>

        <div class="chat-section">
            <h3>DataChannel 聊天</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="输入消息..." disabled>
                <button class="btn-connect" id="sendBtn" onclick="sendMessage()" disabled>发送</button>
            </div>
        </div>

        <div class="log-container">
            <h3>日志</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let pc = null;
        let localStream = null;
        let dataChannel = null;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const item = document.createElement('div');
            item.className = 'log-item ' + type;
            const time = new Date().toLocaleTimeString();
            item.textContent = `[${time}] ${msg}`;
            logDiv.insertBefore(item, logDiv.firstChild);
        }

        function setPeerStatus(text, cls) {
            const el = document.getElementById('peerStatus');
            el.textContent = text;
            el.className = 'status-value ' + cls;
        }

        function setDcStatus(text, cls) {
            const el = document.getElementById('dcStatus');
            el.textContent = text;
            el.className = 'status-value ' + cls;
        }

        function addChatMessage(text, isLocal) {
            const chatDiv = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'chat-msg ' + (isLocal ? 'local' : 'remote');
            msg.textContent = text;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function startCall() {
            try {
                document.getElementById('connectBtn').disabled = true;
                log('正在获取本地媒体...');
                
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                
                document.getElementById('localVideo').srcObject = localStream;
                log('本地媒体获取成功', 'success');

                const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProto}//${location.host}/ws`;
                log(`连接信令服务器: ${wsUrl}`);
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('信令服务器已连接', 'success');
                    setPeerStatus('连接中...', '');
                    createPeerConnection();
                };
                
                ws.onmessage = async (event) => {
                    const msg = JSON.parse(event.data);
                    log(`收到信令: ${msg.type}`);
                    await handleSignalingMessage(msg);
                };
                
                ws.onclose = () => {
                    log('信令服务器断开', 'error');
                    setPeerStatus('已断开', 'disconnected');
                    setDcStatus('未打开', 'disconnected');
                };
                
                ws.onerror = (err) => {
                    log('WebSocket错误', 'error');
                    console.error(err);
                };

            } catch (err) {
                log('错误: ' + err.message, 'error');
                document.getElementById('connectBtn').disabled = false;
            }
        }

        function createPeerConnection() {
            pc = new RTCPeerConnection(configuration);
            
            pc.ondatachannel = (event) => {
                log('收到 DataChannel: ' + event.channel.label);
                dataChannel = event.channel;
                setupDataChannel();
            };
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    log('发送 ICE 候选');
                    ws.send(JSON.stringify({
                        type: 'ice',
                        candidate: event.candidate
                    }));
                }
            };
            
            pc.oniceconnectionstatechange = () => {
                log('ICE 状态: ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'connected' || 
                    pc.iceConnectionState === 'completed') {
                    setPeerStatus('已连接', 'connected');
                    document.getElementById('hangupBtn').disabled = false;
                } else if (pc.iceConnectionState === 'disconnected' ||
                           pc.iceConnectionState === 'failed' ||
                           pc.iceConnectionState === 'closed') {
                    setPeerStatus('已断开', 'disconnected');
                    setDcStatus('未打开', 'disconnected');
                    document.getElementById('chatInput').disabled = true;
                    document.getElementById('sendBtn').disabled = true;
                }
            };
            
            pc.ontrack = (event) => {
                log('收到远端媒体流', 'success');
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };
            
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
                log('已添加本地媒体轨');
            }
            
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    log('发送 SDP Offer');
                    ws.send(JSON.stringify({
                        type: 'offer',
                        sdp: pc.localDescription.sdp
                    }));
                })
                .catch(err => {
                    log('创建Offer失败: ' + err.message, 'error');
                });
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                log('DataChannel 已打开', 'success');
                setDcStatus('已打开', 'connected');
                document.getElementById('chatInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            };
            
            dataChannel.onmessage = (event) => {
                log('收到 DataChannel 消息: ' + event.data);
                addChatMessage(event.data, false);
            };
            
            dataChannel.onclose = () => {
                log('DataChannel 已关闭', 'error');
                setDcStatus('已关闭', 'disconnected');
                document.getElementById('chatInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
            };
            
            dataChannel.onerror = (err) => {
                log('DataChannel 错误', 'error');
                console.error(err);
            };
        }

        async function handleSignalingMessage(msg) {
            if (!pc) return;
            
            switch (msg.type) {
                case 'answer':
                    log('收到 SDP Answer');
                    await pc.setRemoteDescription(new RTCSessionDescription({
                        type: 'answer',
                        sdp: msg.sdp
                    }));
                    log('SDP Answer 已设置', 'success');
                    break;
                    
                case 'ice':
                    log('收到 ICE 候选');
                    if (msg.candidate) {
                        await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    }
                    break;
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !dataChannel || dataChannel.readyState !== 'open') return;
            
            dataChannel.send(text);
            addChatMessage(text, true);
            input.value = '';
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function hangUp() {
            log('挂断通话');
            
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            
            if (pc) {
                pc.close();
                pc = null;
            }
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('hangupBtn').disabled = true;
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            setPeerStatus('未连接', 'disconnected');
            setDcStatus('未打开', 'disconnected');
            document.getElementById('chatMessages').innerHTML = '';
        }
    </script>
</body>
</html>
